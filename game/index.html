}

/* 0.95 (a magical, casino-like reroll — the cards no longer spin round on themselves, mirrored halfway): the cards
   are gathered into one glowing deck in the middle (--dx / --dy: each card's way to the cards' centre, --rz its tilt in
   the deck: set by levelUpMenu), the die is thrown, then the new cards are dealt from the deck face down — the back of a
   casino card in the game's colours, Ecaflip's clover —, fly to their places and turn over once (the back hides the face
   while it is turned away: cardBack switches at the flip's half-way point, the flip's segment being linear), a sheen
   runs over each. No click while they fly (pointer-events), the class goes once they are down. (the flip too fast
   or buggy: it took 0.16 s, and the keyframes' transform lists differed, so Chrome blended whole matrices — now 1.1 s
   with a 0.44 s turn, the same function list in every keyframe) */
.levelup.rolling .up-card { animation: cardGather .42s cubic-bezier(.55,0,.75,.2) forwards; pointer-events: none; }
/* 0.96 ('the little flip at the end'): once dealt, the 'dealing' class goes and the cards' own entrance (cardin, a
